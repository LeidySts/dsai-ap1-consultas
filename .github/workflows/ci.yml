name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcaconsulta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/marcaconsulta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r src/backend/requirements.txt pytest==8.3.4 httpx==0.28.1
      - run: pytest
      - name: migracoes aplicam do zero
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/marcaconsulta_test
        run: |
          python -c "from app.core.db import engine; from sqlalchemy import text; c = engine.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head
          python -m app.seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
