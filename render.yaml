services:
  - type: web
    name: marcaconsulta
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marcaconsulta-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: SEED_DEMO
        value: "true"

databases:
  - name: marcaconsulta-db
    plan: free
    region: oregon
    databaseName: marcaconsulta
    user: marcaconsulta
